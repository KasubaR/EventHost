name: MySQL compatibility

# The main suite runs on in-memory SQLite. This job checks what SQLite cannot: migrations on a real
# MySQL (forward and back), then the subset of tests listed in phpunit.mysql.xml.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: mysql-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: eventhost_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: eventhost_test
      DB_USERNAME: root
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, gd, intl, zip, bcmath, exif
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrate fresh (forward)
        run: php artisan migrate:fresh --force

      - name: Roll every migration back, then forward again
        run: |
          php artisan migrate:rollback --step=1000 --force
          php artisan migrate --force

      - name: Run MySQL test subset
        run: php artisan test --configuration=phpunit.mysql.xml
